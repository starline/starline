<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Andri Huga  starline">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="980" cy="70" r="140" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="180" cy="300" r="120" fill="url(#glow)" filter="url(#soft)"/>

  <!-- constellation / grid -->
  <g stroke="#94a3b8" stroke-opacity="0.12" stroke-width="1">
    <path d="M80 80 H1120 M80 140 H1120 M80 200 H1120 M80 260 H1120 M80 320 H1120"/>
    <path d="M200 40 V320 M400 40 V320 M600 40 V320 M800 40 V320 M1000 40 V320"/>
  </g>

  <!-- orbit dots -->
  <g fill="#67e8f9">
    <circle cx="220" cy="88" r="3" opacity="0.9"/>
    <circle cx="980" cy="250" r="2.5" opacity="0.7"/>
    <circle cx="860" cy="96" r="2" opacity="0.8"/>
    <circle cx="320" cy="280" r="2.5" opacity="0.6"/>
  </g>

  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#94a3b8">
    FULL-STACK · ECOMMERCE · AUTOMATION
  </text>

  <text x="600" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">
    Andri Huga
  </text>

  <rect x="470" y="214" width="260" height="4" rx="2" fill="url(#accent)"/>

  <text x="600" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#e2e8f0">
    @starline
  </text>

  <text x="600" y="312" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">
    Building HugaShop · HugSales · AI-powered tools
  </text>
</svg>
